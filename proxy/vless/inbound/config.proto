syntax = "proto3";

package xray.proxy.vless.inbound;
option csharp_namespace = "Xray.Proxy.Vless.Inbound";
option go_package = "github.com/xtls/xray-core/proxy/vless/inbound";
option java_package = "com.xray.proxy.vless.inbound";
option java_multiple_files = true;

import "common/protocol/user.proto";

message Fallback {
  string name = 1;
  string alpn = 2;
  string path = 3;
  string type = 4;
  string dest = 5;
  uint64 xver = 6;
}

message Config {
  repeated xray.common.protocol.User users = 1;
  repeated Fallback fallbacks = 2;

  string decryption = 3;
  uint32 xorMode = 4;
  int64 seconds_from = 5;
  int64 seconds_to = 6;
  string padding = 7;
  // Bounds live flows of one account per inbound tag, per email (0 =
// unlimited). A "session"
  // here is a live TCP or UDP flow, so tune it in flows, not devices: a
  // browser alone opens several at once. Counted where the real connection
  // enters Process — an XTLS/vision flow and a whole MUX bundle each take one
  // slot. Excess flows get a closed connection, the only refusal a VLESS
  // client can see; live flows are never cut.
  uint32 max_sessions_per_user = 8;
}
